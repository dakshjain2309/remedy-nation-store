
name: Update npm lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Check package versions
        run: |
          echo "Commit being used:"
          git rev-parse HEAD
          echo "Next.js version:"
          node -p "require('./package.json').dependencies.next"
          echo "OpenNext version:"
          node -p "require('./package.json').devDependencies['@opennextjs/cloudflare']"

      - name: Update package-lock.json
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Update package-lock.json for Cloudflare"
            git push
          fi
